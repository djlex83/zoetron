[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoetron"
version = "0.1.0"
description = "Zoetron - recursive ASI-style agent loop (mock-first, provider-agnostic)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.5", "pydantic-settings>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zoetron = "zoetron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
