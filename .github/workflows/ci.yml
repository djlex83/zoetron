name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && pip install pytest
      - run: python -m pytest tests/ -q
        env:
          # hermetic: never read a developer .env in CI
          ZOETRON_MODEL: ""
