name: PAGES

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # the landing page lives in site/ and builds into docs/ (never emptying
      # it — the heartbeat owns brain.html, graph.html and wiki/ in there)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build landing page
        working-directory: site
        run: |
          npm ci
          npm run build

      # creates the Pages site automatically if it does not exist yet
      # NOTE: GitHub forces Node 24 on these actions already; the
      # "Node 20 deprecated" warning is informational only and
      # disappears when the actions ship Node-24-native releases.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
