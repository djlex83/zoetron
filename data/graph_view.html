// Physik-Zustand
let vx={},vy={},fx={},fy={};
N.forEach(n=>{vx[n.id]=0;vy[n.id]=0});
let zoom=1,camx=0,camy=0,drag=null,hov=null,sel=null,pin=false,
 pan=false,px=0,py=0;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const tip=document.getElementById('tip'),det=document.getElementById('detail');
function resize(){cv.width=innerWidth;cv.height=innerHeight}
resize();addEventListener('resize',resize);
document.getElementById('hud').innerHTML=
 document.getElementById('hud').innerHTML
  .replace('NODES',N.length).replace('LINKS',L.length);
const idx={};N.forEach(n=>idx[n.id]=n);
function step(){
 // Abstossung + Anziehung + sanfte Mitte
 for(let i=0;i<N.length;i++){const a=N[i];
  let ax=0,ay=0;
  for(let j=0;j<N.length;j++){if(i===j)continue;const b=N[j];
   const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+40;
   ax+=dx/d2*30;ay+=dy/d2*30;}
  L.forEach(l=>{if(l.a===a.id||l.b===a.id){
   const o=idx[l.a===a.id?l.b:l.a];
   const dx=o.x-a.x,dy=o.y-a.y;ax+=dx*.002;ay+=dy*.002;}});
  ax+=(-a.x)*.0006;ay+=(-a.y)*.0006;
  fx[a.id]=ax*(a===drag?0:1);fy[a.id]=ay*(a===drag?0:1);}
 N.forEach(n=>{vx[n.id]=(vx[n.id]+fx[n.id])*.86;
  vy[n.id]=(vy[n.id]+fy[n.id])*.86;
  if(n!==drag){n.x+=vx[n.id];n.y+=vy[n.id];}});
}
N.forEach(n=>{n.x=Math.random()*800-400;n.y=Math.random()*600-300;});

 if(!pin){step();t++;}
 draw();requestAnimationFrame(loop);});
function W(){return{x:cv.width/2+camx*zoom,y:cv.height/2+camy*zoom}}
function s2w(sx,sy){const w=W();return{x:(sx-w.x)/zoom,y:(sy-w.y)/zoom}}
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);ctx.save();
 const w=W();ctx.translate(w.x,w.y);ctx.scale(zoom,zoom);

 const nb=new Set();
 if(act){nb.add(act.id);L.forEach(l=>{if(l.a===act.id)nb.add(l.b);
  if(l.b===act.id)nb.add(l.a);});}
 // Basis-Kanten
 L.forEach(l=>{const a=idx[l.a],b=idx[l.b];

  ctx.globalAlpha=hot?1:.85;ctx.lineWidth=hot?2.2:1.1;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});

  const a=n.a??0;
  const cr=Math.round(0+a*(70-0)), cg=Math.round(230-a*(230-120)),
        cb=Math.round(160+a*(190-160));
  ctx.fillStyle=(act&&hot&&n.f)?'#00d4ff':`rgb(${cr},${cg},${cb})`;
  if(n.f===0&&!(act&&hot)){ // Ziele/Ereignisse: gleicher Verlauf, rötlicher Ton
    ctx.fillStyle=`rgb(${Math.round(255-a*90)},${Math.round(126-Math.round(a*40))},${Math.round(182-Math.round(a*60))})`;}

  ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();

 });
 // Aktive Verbindungen NACH den Knoten nachzeichnen -> leuchten ueber allem
 if(act){ctx.strokeStyle='#ffd166';ctx.globalAlpha=.9;

  if(l.b===n.id)nb.push(idx[l.a]);});

  // Interne Typen -> menschliche Kategorien (deutsch)
  const CATS={'creator_teaching':'📖 Unterweisung','retro_lesson':'🪞 Lektion',
  'anti_pattern':'🚫 Verbotsliste','strategy':'🏆 Strategie',
  'swarm_artifact':'🛠 Selbst gebaut','dream':'💭 Traum',
  'tool:':'🔧 Werkzeug','frontier':'👁 Beobachtung','drive_':'🔥 Ziel',
  'last_':'⚙️ Status'};
  function catOf(l){l=l||'';for(const k in CATS){
  if(k.endsWith(':')?l.startsWith(k):l.includes(k))return CATS[k];}
  return '';}
  function clean(t){return (t||'').replace(/\[[\w_]+\]\s*/,'')
  .replace(/^\w+:/,'');}
  const txt=clean(n.t||n.l);
  det.innerHTML='<b>'+(n.f?'🧠 Fakt':'💬 Ziel/Ereignis')+'</b><br>'+
   txt.replace(/</g,'&lt;')+'<hr style="border-color:#2c3a5c">'+
   '<b>'+nb.length+' Nachbarn:</b><br>'+
   nb.slice(0,8).map(m=>{const mt=m.t||m.l;
    return '• '+catOf(mt)+' '+clean(mt).slice(0,110).replace(/</g,'&lt;');})
    .join('<br>')+(nb.length>8?'<br>…':'');
 }else det.style.display='none';});
 cv.addEventListener('dblclick',()=>{camx=camy=0;zoom=1;});
 addEventListener('wheel',e=>{e.preventDefault();
 zoom*=e.deltaY<0?1.12:0.89;zoom=Math.max(.15,Math.min(8,zoom));},
 {passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;
 det.style.display='none';}});
