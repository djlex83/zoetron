 pan=false,px=0,py=0;

 document.getElementById('hud').innerHTML

const idx={};N.forEach(n=>idx[n.id]=n);
function step(){
 // Abstossung + Anziehung + sanfte Mitte
 for(let i=0;i<N.length;i++){const a=N[i];
  let ax=0,ay=0;
  for(let j=0;j<N.length;j++){if(i===j)continue;const b=N[j];
   const dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+40;
   ax+=dx/d2*30;ay+=dy/d2*30;}
  L.forEach(l=>{if(l.a===a.id||l.b===a.id){
   const o=idx[l.a===a.id?l.b:l.a];
   const dx=o.x-a.x,dy=o.y-a.y;ax+=dx*.002;ay+=dy*.002;}});
  ax+=(-a.x)*.0006;ay+=(-a.y)*.0006;
  fx[a.id]=ax*(a===drag?0:1);fy[a.id]=ay*(a===drag?0:1);}
 N.forEach(n=>{vx[n.id]=(vx[n.id]+fx[n.id])*.86;
  vy[n.id]=(vy[n.id]+fy[n.id])*.86;
  if(n!==drag){n.x+=vx[n.id];n.y+=vy[n.id];}});
}
N.forEach(n=>{n.x=Math.random()*800-400;n.y=Math.random()*600-300;});

 if(!pin){step();t++;}
 draw();requestAnimationFrame(loop);});
function W(){return{x:cv.width/2+camx*zoom,y:cv.height/2+camy*zoom}}

  if(l.b===act.id)nb.add(l.a);});}

 L.forEach(l=>{const a=idx[l.a],b=idx[l.b];

  ctx.globalAlpha=hot?1:.85;ctx.lineWidth=hot?2.2:1.1;
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();});
