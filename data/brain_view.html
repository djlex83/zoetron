const DPR=Math.min(window.devicePixelRatio||1,1.5);

const idx={};N.forEach(n=>idx[n.id]=n);

function sprite(rgb){const s=document.createElement('canvas');
 s.width=s.height=64;const c=s.getContext('2d');
 const g=c.createRadialGradient(32,32,0,32,32,32);
 g.addColorStop(0,'rgba('+rgb+',.95)');
 g.addColorStop(.35,'rgba('+rgb+',.38)');
 g.addColorStop(1,'rgba('+rgb+',0)');
 c.fillStyle=g;c.fillRect(0,0,64,64);return s;}
const SP_F=sprite('64,190,255'),SP_O=sprite('255,126,182'),
      SP_P=sprite('255,220,130');
// Alters-Farbverlauf: 5 Stufen pro Typ (0=frisch .. 4=sehr alt)
// Fakten: frisches Gruen -> gedecktes Blaugrau
// Ziele/Ereignisse: frisches Pink -> Altrosa
const AGE_F=['80,255,120','70,225,150','60,190,175','75,150,180','95,125,170'];
const AGE_O=['255,120,180','240,125,170','220,125,160','195,125,150','170,125,140'];
const SP_AGE_F=AGE_F.map(c=>sprite(c));
const SP_AGE_O=AGE_O.map(c=>sprite(c));
// Groessen-Skala: Neuronen wachsen MIT dem Viewport (frueher fehlte
// dieser Faktor -> alles war winzig)
let scaleK=6;
// ---- Pulse (Aktionspotenziale), gedrosselt
setInterval(()=>{if(L.length&&pulses.length<12){
 pulses.push({l:L[Math.random()*L.length|0],t:0,
  sp:.010+Math.random()*.018});}},430);
// ---- Projektion aller Neuronen (einmal pro Frame, alles in CSS-px)
function refreshPositions(){
 const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const W=innerWidth,H=innerHeight;          // CSS-px (nicht cv.width!)
 const scale=zoom*Math.min(W,H)/4.6;
 for(const n of N){
  const x=n.p[0]*cy+n.p[2]*sy,z=-n.p[0]*sy+n.p[2]*cy,y=n.p[1];
  const y2=y*cx-z*sx,z2=y*sx+z*cx;
  const d=3.2/(3.2-z2),s=scale*d;
  n.q={sx:W/2+x*s,sy:H/2-y2*s,d:d,_z:z2};}
}
refreshPositions();
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);          // CSS-px zeichnen
 ctx.clearRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#05070f';ctx.fillRect(0,0,cv.width,cv.height);
 // Synapsen
 ctx.lineCap='round';
 for(let i=0;i<L.length;i++){const l=L[i],A=idx[l.a].q,B=idx[l.b].q;
  ctx.strokeStyle=l.c?'#8a5cf6':'#3d5f96';
  ctx.globalAlpha=l.c?.55:.4;
  ctx.lineWidth=l.c?1.5:1;
  ctx.beginPath();ctx.moveTo(A.sx,A.sy);ctx.lineTo(B.sx,B.sy);ctx.stroke();}

  ctx.globalAlpha=.9;
  ctx.drawImage(SP_P,x-r,y-r,r*2,r*2);}

 // Neuronen hinten -> vorne (Sprites statt Gradienten)

  const r=Math.max(3.2,(1.5+Math.min(n.d,9)*.9)*Math.sqrt(q.d)*scaleK);
  const hot=n===hover||n===sel;
  ctx.globalAlpha=hot?1:n.glow;
  // Alters-Farbe: frisch = leuchtend, alt = gedeckt (sichtbarer Verlauf)
  const age=n.a??0;
  const bucket=Math.min(4,Math.round(age*4));
  const sp=n.f?SP_AGE_F[bucket]:SP_AGE_O[bucket];
  ctx.drawImage(sp,q.sx-r*2.2,q.sy-r*2.2,r*4.4,r*4.4);
  if(hot){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=1.3;
   ctx.beginPath();ctx.arc(q.sx,q.sy,Math.max(r,1.6),0,7);ctx.stroke();}}
 ctx.globalAlpha=1;

  ctx.lineWidth=2.6;ctx.lineCap='round';

   ctx.beginPath();ctx.moveTo(A.sx,A.sy);ctx.lineTo(B.sx,B.sy);ctx.stroke();}
  ctx.globalAlpha=1;}

}

function pick(x,y){let best=null,bd=1e9;
 for(const n of N){if(!n.q)continue;
  const d=Math.hypot(n.q.sx-x,n.q.sy-y);
  const rr=Math.max(11,(1.5+Math.min(n.d,9)*.9)*Math.sqrt(n.q.d)*scaleK*.5)+6;
  if(d<rr&&d<bd){bd=d;best=n;}}return best;}

cv.addEventListener('click',e=>{

 if(n){const nb=[];
  for(const l of L){if(l.a===n.id)nb.push(idx[l.b]);
   if(l.b===n.id)nb.push(idx[l.a]);}
  det.style.display='block';
  // Interne Typen -> menschliche Kategorien (deutsch)
  const CATS={'creator_teaching':'📖 Unterweisung','retro_lesson':'🪞 Lektion',
  'anti_pattern':'🚫 Verbotsliste','strategy':'🏆 Strategie',
  'swarm_artifact':'🛠 Selbst gebaut','dream':'💭 Traum',
  'tool:':'🔧 Werkzeug','frontier':'👁 Beobachtung','drive_':'🔥 Ziel',
  'last_':'⚙️ Status'};
  function catOf(l){l=l||'';for(const k in CATS){
  if(k.endsWith(':')?l.startsWith(k):l.includes(k))return CATS[k];}
  return '';}
  function clean(t){return (t||'').replace(/\[[\w_]+\]\s*/,'')
   .replace(/^\w+:/,'');}
  det.innerHTML='<b>'+(n.f?'🧠 Fakt-Neuron':'💬 Ziel/Ereignis-Neuron')
   +'</b><br>'+clean(n.t||n.l).replace(/</g,'&lt;')
   +'<hr style="border-color:#2c3a5c"><b>'+nb.length+' Synapsen:</b><br>'
   +nb.slice(0,8).map(m=>'• '+catOf(clean(m.t||m.l))
     +(m.t&&m.t.includes('·')?' <span style="color:#9fb3d9">'
       +m.t.slice(m.t.indexOf('·')+1).replace(/</g,'&lt;')+'</span>':'')
     +(m.t&&!m.t.includes('·')?' '+clean(m.t).slice(0,90).replace(/</g,'&lt;'):''))
    .join('<br>')+(nb.length>8?'<br>…':'');
 }else det.style.display='none';});
cv.addEventListener('dblclick',()=>{rx=-.22;ry=.55;zoom=1;sel=null;

addEventListener('wheel',e=>{e.preventDefault();
