const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

 .innerHTML.replace('NEURONEN',N.length).replace('SYNAPSEN',L.length);
const DPR=Math.min(window.devicePixelRatio||1,1.5);
function resize(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;
 cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
resize();addEventListener('resize',resize);
const idx={};N.forEach(n=>idx[n.id]=n);
N.forEach(n=>{n.glow=Math.min(.85,.22+n.d*.08);});
let ry=.55,rx=-.22,zoom=1,auto=true,down=false,moved=0,
 px=0,py=0,pulses=[],hover=null,sel=null;
// Auto-Rotation bleibt AUS, sobald der Nutzer eingreift.
// Nur Doppelklick (Reset) schaltet sie wieder ein.
// ---- Performance: Glow-Sprites einmal vorbacken statt hunderte
// Gradienten pro Frame
function sprite(rgb){const s=document.createElement('canvas');
 s.width=s.height=64;const c=s.getContext('2d');
 const g=c.createRadialGradient(32,32,0,32,32,32);
 g.addColorStop(0,'rgba('+rgb+',.95)');
 g.addColorStop(.35,'rgba('+rgb+',.38)');
 g.addColorStop(1,'rgba('+rgb+',0)');
 c.fillStyle=g;c.fillRect(0,0,64,64);return s;}
const SP_F=sprite('64,190,255'),SP_O=sprite('255,126,182'),
      SP_P=sprite('255,220,130');
// Groessen-Skala: Neuronen wachsen MIT dem Viewport (frueher fehlte
// dieser Faktor -> alles war winzig)
let scaleK=6;
// ---- Pulse (Aktionspotenziale), gedrosselt
setInterval(()=>{if(L.length&&pulses.length<12){
 pulses.push({l:L[Math.random()*L.length|0],t:0,
  sp:.010+Math.random()*.018});}},430);
// ---- Projektion aller Neuronen (einmal pro Frame)
function refreshPositions(){
 const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);
 const scale=zoom*Math.min(innerWidth,innerHeight)/4.6;
 for(const n of N){
  const x=n.p[0]*cy+n.p[2]*sy,z=-n.p[0]*sy+n.p[2]*cy,y=n.p[1];
  const y2=y*cx-z*sx,z2=y*sx+z*cx;
  const d=3.2/(3.2-z2),s=scale*d;
  n.q={sx:innerWidth/2+x*s,sy:innerHeight/2-y2*s,d:d,_z:z2};}
}
refreshPositions();
function draw(){
 ctx.clearRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#05070f';ctx.fillRect(0,0,cv.width,cv.height);
 // Synapsen
 ctx.lineCap='round';
 for(let i=0;i<L.length;i++){const l=L[i],A=idx[l.a].q,B=idx[l.b].q;
  ctx.strokeStyle=l.c?'#8a5cf6':'#3d5f96';
  ctx.globalAlpha=l.c?.55:.4;
  ctx.lineWidth=l.c?1.5:1;
  ctx.beginPath();ctx.moveTo(A.sx,A.sy);ctx.lineTo(B.sx,B.sy);ctx.stroke();}
 ctx.globalAlpha=1;
 // Pulse (Aktionspotenziale)
 for(const p of pulses){const A=idx[p.l.a].q,B=idx[p.l.b].q;
  const x=A.sx+(B.sx-A.sx)*p.t,y=A.sy+(B.sy-A.sy)*p.t,r=9*A.d*zoom;
  ctx.globalAlpha=.9;
  ctx.drawImage(SP_P,x-r,y-r,r*2,r*2);}
 ctx.globalAlpha=1;
 // Neuronen hinten -> vorne (Sprites statt Gradienten)
 const order=[...N].sort((a,b)=>a.q._z-b.q._z);
 for(const n of order){const q=n.q;
  const r=Math.max(3.2,(1.5+Math.min(n.d,9)*.9)*q.d*zoom*scaleK);
  const hot=n===hover||n===sel;
  ctx.globalAlpha=hot?1:n.glow;
  const sp=n.f?SP_F:SP_O;
  ctx.drawImage(sp,q.sx-r*2.2,q.sy-r*2.2,r*4.4,r*4.4);

function pick(x,y){let best=null,bd=1e9;
 for(const n of N){if(!n.q)continue;
  const d=Math.hypot(n.q.sx-x,n.q.sy-y);
  const rr=Math.max(11,(1.5+Math.min(n.d,9)*.9)*n.q.d*zoom*scaleK*.55)+6;
  if(d<rr&&d<bd){bd=d;best=n;}}return best;}
