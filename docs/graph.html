let vx={},vy={},fx={},fy={};
N.forEach(n=>{vx[n.id]=0;vy[n.id]=0});

 for(let i=0;i<N.length;i++){const a=N[i];
  let ax=0,ay=0;

   ax+=dx/d2*30;ay+=dy/d2*30;}
  L.forEach(l=>{if(l.a===a.id||l.b===a.id){
   const o=idx[l.a===a.id?l.b:l.a];
   const dx=o.x-a.x,dy=o.y-a.y;ax+=dx*.002;ay+=dy*.002;}});

 if(hov){nb.add(hov.id);L.forEach(l=>{if(l.a===hov.id)nb.add(l.b);
  if(l.b===hov.id)nb.add(l.a);});}
 L.forEach(l=>{const a=idx[l.a],b=idx[l.b];

  ctx.globalAlpha=hot?1:.85;ctx.lineWidth=hot?2.2:1.1;

 });
 ctx.restore();ctx.globalAlpha=1;
